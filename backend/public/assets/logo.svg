<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 60" width="260" height="60">
  <defs>
    <!-- Gradient for the phone icon -->
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f7fa;stop-opacity:1" />
    </linearGradient>
    <!-- Gradient for the swoosh -->
    <linearGradient id="swooshGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD289;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.5" />
    </linearGradient>
  </defs>

  <!-- ── PHONE ICON ── -->
  <!-- Phone body -->
  <rect x="4" y="4" width="28" height="48" rx="5" ry="5"
        fill="none" stroke="url(#phoneGrad)" stroke-width="2.8"/>
  <!-- Speaker slot -->
  <rect x="13" y="8" width="10" height="2.5" rx="1.2"
        fill="white" opacity="0.85"/>
  <!-- Home button dot -->
  <circle cx="18" cy="47" r="2"
          fill="white" opacity="0.7"/>
  <!-- Screen area -->
  <rect x="7" y="13" width="22" height="28" rx="2"
        fill="white" opacity="0.12"/>

  <!-- ── SWOOSH ARC ── -->
  <!-- Main swoosh — large arc sweeping under/around phone -->
  <path d="M 2 38 Q 18 58 52 44"
        fill="none" stroke="url(#swooshGrad)" stroke-width="3"
        stroke-linecap="round"/>
  <!-- Swoosh tail flick -->
  <path d="M 48 44 Q 54 41 52 36"
        fill="none" stroke="#FFD289" stroke-width="2.5"
        stroke-linecap="round" opacity="0.8"/>

  <!-- ── BRAND TEXT ── -->
  <!-- "Isa & Dagi" — main brand name -->
  <text x="46" y="28"
        font-family="Rubik, sans-serif"
        font-size="20"
        font-weight="700"
        fill="white"
        letter-spacing="0.5">Isa Moh</text>

  <!-- Thin separator line under brand name -->
  <line x1="46" y1="32" x2="200" y2="32"
        stroke="white" stroke-width="0.8" opacity="0.35"/>

  <!-- "Mobile Shop" — tagline -->
  <text x="47" y="44"
        font-family="Rubik, sans-serif"
        font-size="11"
        font-weight="500"
        fill="#FFD289"
        letter-spacing="3">MOBILE SHOP</text>

  <!-- Small accent dot before tagline -->
  <circle cx="43" cy="41" r="1.5" fill="#FFD289" opacity="0.8"/>
</svg>
